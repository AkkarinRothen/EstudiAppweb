<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensayos y Debates - EstudiApp Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/ui-modal.css">
    <style>
        /* Presets are full-page cards */
        body { padding: 20px; }
        .card { 
            background: var(--container); border-radius: 28px; padding: 32px 24px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.08); max-width: 500px; width: 100%; 
            text-align: center; border: 1px solid var(--surface-variant); position: relative; 
        }
        .history { margin-top: 32px; width: 100%; text-align: left; }
        .history h2 { font-size: 18px; margin-bottom: 12px; color: var(--primary); }
        .history-list { max-height: 200px; overflow-y: auto; border-radius: 16px; border: 1px solid var(--surface-variant); background: var(--container); }
        .history-item { font-size: 14px; padding: 12px 16px; border-bottom: 1px solid var(--surface-variant); display: flex; justify-content: space-between; align-items: center; }
        .back-link { margin-top: 30px; color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

        @media (max-width: 480px) {
            body { padding: 0; }
            .card { border-radius: 0; min-height: 100dvh; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ensayos y Debates</h1>
        <p class="desc">Conectores avanzados y verbos argumentativos.</p>

        <div class="image-toggle-container">
            <input type="checkbox" id="enableImages" checked>
            <label for="enableImages">Mostrar Imágenes 🖼️</label>
        </div>

        <button id="btnLaunchpad" class="btn-change-mode">
            <span>🎯 Cambiar Modo de Estudio</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
        </button>

        <div id="launchpadArea" class="launchpad-container"></div>

        <div class="result-area" id="resultArea">
            <div id="srsBadge" class="srs-badge" style="display: none;">Caja 1</div>
            <div id="timerContainer" class="timer-container" style="display:none">
                <svg class="timer-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" fill="currentColor"/></svg>
                <span id="timerVal">60s</span>
            </div>
            <div id="quizScore" class="quiz-score" style="display:none">Puntuación: 0/0</div>
            
            <div class="dice-container" id="diceContainer">
                <div class="die" id="die" data-face="1">
                    <div class="face face-1">1</div>
                    <div class="face face-2">2</div>
                    <div class="face face-3">3</div>
                    <div class="face face-4">4</div>
                    <div class="face face-5">5</div>
                    <div class="face face-6">6</div>
                </div>
            </div>

            <div class="roll-val" id="rollVal">Tira el dado para empezar</div>
            <div class="vocab-image-container" id="imgContainer"><img id="vocabImg" class="vocab-image" src="" alt=""></div>
            <div id="mainText" class="entry-text">---</div>
            <div id="exampleText" class="example-sentence"></div>

            <div id="subContainer" class="translation">
                <span id="subText"></span>
                <button id="speaker" class="speaker-btn" title="Escuchar">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
            <button id="btnReveal" class="btn-reveal" style="display:none">MOSTRAR</button>
            
            <div id="writeArea" class="write-container" style="display:none">
                <input type="text" id="writeInput" class="write-input" placeholder="Escribe la traducción..." autocomplete="off">
                <div id="writeFeedback" class="write-feedback"></div>
            </div>
            <div id="scrambledArea" class="scrambled-container" style="display:none"></div>
            <div id="quizOptions" class="quiz-container" style="display:none"></div>
            <div id="matchArea" class="match-container" style="display:none"></div>
            <div id="bubbleArea" class="bubble-container" style="display:none"></div>
            <div id="sniperArea" class="sniper-container" style="display:none"></div>
            <div id="dragArea" class="drag-container" style="display:none"></div>
            <div id="dictationArea" class="dictation-container" style="display:none"></div>
            <div id="wordleArea" class="wordle-container" style="display:none"></div>
            <div id="sentenceArea" class="sentence-container" style="display:none"></div>
            <div id="diagramArea" class="diagram-container" style="display:none"></div>
            <div id="srsFeedback" class="srs-feedback-container" style="display:none">
                <button class="srs-btn srs-btn-again">❌ Difícil</button>
                <button class="srs-btn srs-btn-good">✅ Fácil</button>
            </div>
        </div>

        <div class="tts-controls">
            <label>Voz (Inglés):</label>
            <select id="voiceSelect" class="tts-select"></select>
            <label>Velocidad:</label>
            <div class="tts-slider-wrapper">
                <input type="range" id="speedSlider" class="tts-slider" min="0.5" max="1.5" step="0.1" value="1.0">
                <span class="tts-val" id="speedVal">1.0x</span>
            </div>
        </div>

        <button id="actionBtn" class="main-btn">Cargando...</button>
    </div>

    <div class="history" id="historySection">
        <h2>Historial</h2>
        <div id="historyList" class="history-list"></div>
    </div>

    <a href="../index.html" class="back-link">← Volver al Portal</a>

    <button id="btnLaunchpad" class="btn-change-mode">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z" fill="currentColor"/></svg>
        <span>Modos</span>
    </button>

    <script type="module">
        import { initPreset } from '../js/modules/preset-runner.js';
        const entries = [{min:1, max:1, text:"Sin embargo -> Nevertheless / However", example:""},{min:2, max:2, text:"Por lo tanto -> Therefore / Consequently", example:""},{min:3, max:3, text:"A pesar de -> Despite / In spite of", example:""},{min:4, max:4, text:"Además -> Furthermore / Moreover", example:""},{min:5, max:5, text:"Por otro lado -> On the other hand", example:""},{min:6, max:6, text:"Subrayar / Destacar -> To highlight / To underline", example:""},{min:7, max:7, text:"Evidencia empírica -> Empirical evidence", example:""},{min:8, max:8, text:"En conclusión -> In a nutshell / In conclusion", example:""}];
        const formula = "1d8";
        initPreset(entries, formula);
    </script>
</body>
</html>
