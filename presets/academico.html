<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Académico: Ensayos y Debates - EstudiApp Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6750A4;
            --on-primary: #FFFFFF;
            --primary-container: #EADDFF;
            --on-primary-container: #21005D;
            --surface: #FEF7FF;
            --on-surface: #1D1B20;
            --surface-variant: #E7E0EC;
            --on-surface-variant: #49454F;
            --outline: #79747E;
            --container: #FFFFFF;
            --error: #B3261E;
            --success: #2E7D32;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #D0BCFF;
                --on-primary: #381E72;
                --primary-container: #4F378B;
                --on-primary-container: #EADDFF;
                --surface: #141218;
                --on-surface: #E6E1E5;
                --surface-variant: #49454F;
                --on-surface-variant: #CAC4D0;
                --outline: #938F99;
                --container: #1D1B20;
                --error: #F2B8B5;
                --success: #81C784;
            }
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--surface);
            color: var(--on-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }
        .card {
            background: var(--container);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--surface-variant);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        h1 { font-size: 28px; margin: 0 0 8px 0; color: var(--primary); font-weight: 600; }
        p.desc { color: var(--on-surface-variant); font-size: 15px; margin: 0 0 20px 0; line-height: 1.4; }

        .image-toggle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--on-surface-variant);
        }
        .image-toggle-container input {
            cursor: pointer;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--surface-variant);
            padding: 4px;
            border-radius: 100px;
        }
        .chip {
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--on-surface-variant);
            transition: all 0.2s;
            flex: 1;
        }
        .chip.active {
            background: var(--primary);
            color: var(--on-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .result-area {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--surface-variant);
            border-radius: 24px;
            margin-bottom: 24px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-sizing: border-box;
        }
        .roll-val { font-size: 12px; opacity: 0.8; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        
        .vocab-image-container {
            width: 100%;
            height: 160px;
            margin-bottom: 16px;
            border-radius: 16px;
            overflow: hidden;
            display: none;
            background: rgba(0,0,0,0.05);
        }
        .vocab-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .entry-text { font-size: 24px; font-weight: 600; color: var(--primary); margin: 0; line-height: 1.3; }

        .translation {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--outline);
            width: 100%;
            font-size: 19px;
            font-style: italic;
            color: var(--on-surface-variant);
            transition: opacity 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .translation.hidden { opacity: 0; pointer-events: none; }

        .btn-reveal {
            background: var(--primary-container);
            color: var(--on-primary-container);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .btn-reveal:hover { transform: scale(1.03); }

        .speaker-btn {
            background: var(--primary-container);
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .speaker-btn:hover { transform: scale(1.1); }
        .speaker-btn svg { fill: var(--on-primary-container); width: 22px; height: 22px; }

        /* Estilos de Quiz */
        .quiz-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .quiz-option {
            background: var(--container);
            border: 2px solid var(--surface-variant);
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--on-surface);
            outline: none;
        }
        .quiz-option:hover:not(:disabled) {
            border-color: var(--primary);
            background: var(--surface-variant);
        }
        .quiz-option.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        .quiz-option.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        .quiz-score {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--primary);
        }

        /* Modo Escritura UI */
        .write-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .write-input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 16px;
            border: 2px solid var(--outline);
            background: var(--container);
            color: var(--on-surface);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            text-align: center;
            transition: border-color 0.2s;
        }
        .write-input:focus {
            border-color: var(--primary);
        }
        .write-feedback {
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
            text-align: center;
            line-height: 1.4;
        }
        .write-feedback.correct {
            color: var(--success);
        }
        .write-feedback.incorrect {
            color: var(--error);
        }
        .diff-del {
            text-decoration: line-through;
            color: var(--error);
            background: rgba(179, 38, 30, 0.1);
            padding: 0 2px;
            border-radius: 2px;
        }
        .diff-ins {
            color: var(--success);
            background: rgba(46, 125, 50, 0.1);
            padding: 0 2px;
            border-radius: 2px;
        }

        /* Botones de Calificación SRS */
        .srs-feedback-container {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 16px;
        }
        .srs-btn {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .srs-btn-again {
            background: var(--error);
            color: white;
        }
        .srs-btn-again:hover {
            background: #962019;
        }
        .srs-btn-good {
            background: var(--success);
            color: white;
        }
        .srs-btn-good:hover {
            background: #236127;
        }

        .actions { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        button.main-btn {
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            padding: 16px 32px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(103, 80, 164, 0.3);
            transition: all 0.2s;
            width: 100%;
        }
        button.main-btn:hover {
            box-shadow: 0 6px 16px rgba(103, 80, 164, 0.4);
            transform: translateY(-2px);
        }
        button.main-btn:active { transform: translateY(0); }

        .history {
            margin-top: 32px;
            width: 100%;
            max-width: 500px;
            text-align: left;
        }
        .history h2 { font-size: 18px; margin-bottom: 12px; color: var(--primary); font-weight: 600; }
        .history-list { max-height: 200px; overflow-y: auto; border-radius: 16px; border: 1px solid var(--surface-variant); background: var(--container); }
        .history-item {
            font-size: 14px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--surface-variant);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .back-link { margin-top: 30px; color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .back-link:hover { transform: translateX(-4px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Académico: Ensayos y Debates</h1>
        <p class="desc">Conectores avanzados y verbos argumentativos.</p>

        <div class="image-toggle-container">
            <input type="checkbox" id="enableImages" checked onchange="toggleImages()">
            <label for="enableImages">Mostrar Imágenes 🖼️</label>
        </div>

        <div class="mode-toggle">
            <button id="modeDirect" class="chip active" onclick="setMode('direct')">Modo Directo</button>
            <button id="modeFlashcard" class="chip" onclick="setMode('flashcard')">Flashcard</button>
            <button id="modeQuiz" class="chip" onclick="setMode('quiz')">Modo Quiz</button>
            <button id="modeWrite" class="chip" onclick="setMode('write')">Escritura</button>
        </div>

        <div class="result-area" id="resultArea">
            <div id="quizScore" class="quiz-score" style="display:none">Puntuación: 0/0</div>
            <div class="roll-val" id="rollVal">Tira el dado para empezar</div>
            
            <div class="vocab-image-container" id="imgContainer">
                <img id="vocabImg" class="vocab-image" src="" alt="Vocabulary Image">
            </div>

            <div id="mainText" class="entry-text">---</div>

            <div id="subContainer" class="translation">
                <span id="subText"></span>
                <button id="speaker" class="speaker-btn" onclick="speak()" title="Escuchar pronunciación">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
            <button id="btnReveal" class="btn-reveal" onclick="reveal()" style="display:none">MOSTRAR TRADUCCIÓN</button>
            
            <div id="writeArea" class="write-container" style="display:none">
                <input type="text" id="writeInput" class="write-input" placeholder="Escribe la traducción aquí..." autocomplete="off">
                <div id="writeFeedback" class="write-feedback"></div>
            </div>

            <div id="quizOptions" class="quiz-container" style="display:none"></div>

            <div id="srsFeedback" class="srs-feedback-container" style="display:none">
                <button class="srs-btn srs-btn-again" onclick="rateSrs(false)">❌ Me costó</button>
                <button class="srs-btn srs-btn-good" onclick="rateSrs(true)">✅ Fácil / Lo sé</button>
            </div>
        </div>

        <div class="actions">
            <button id="actionBtn" class="main-btn" onclick="roll()">Tirar 1d8</button>
        </div>
    </div>

    <div class="history" id="historySection">
        <h2>Historial de hoy</h2>
        <div id="historyList" class="history-list"></div>
    </div>

    <a href="../index.html" class="back-link">← Volver al Portal</a>

    <script>
        const entries = [{min:1, max:1, text:"Sin embargo -> Nevertheless / However"},{min:2, max:2, text:"Por lo tanto -> Therefore / Consequently"},{min:3, max:3, text:"A pesar de -> Despite / In spite of"},{min:4, max:4, text:"Además -> Furthermore / Moreover"},{min:5, max:5, text:"Por otro lado -> On the other hand"},{min:6, max:6, text:"Subrayar / Destacar -> To highlight / To underline"},{min:7, max:7, text:"Evidencia empírica -> Empirical evidence"},{min:8, max:8, text:"En conclusión -> In a nutshell / In conclusion"}];
        const formula = "1d8";
        const packId = window.location.pathname.split('/').pop().replace('.html', '') || 'unknown_pack';

        let currentMode = 'direct';
        let isRevealed = true;
        let lastEnglishText = "";
        let lastSpanishText = "";
        let currentQuizEntry = null;

        // Quiz State
        let quizAttempts = 0;
        let quizCorrect = 0;

        // SRS Helpers
        function getSrsData() {
            try {
                return JSON.parse(localStorage.getItem('estudiapp_srs_data')) || {};
            } catch (e) {
                return {};
            }
        }

        function saveSrsData(data) {
            localStorage.setItem('estudiapp_srs_data', JSON.stringify(data));
        }

        function getStats() {
            try {
                let stats = JSON.parse(localStorage.getItem('estudiapp_stats'));
                if (!stats) stats = { streak: 0, lastStudyDate: null, totalReviews: 0, totalCorrect: 0 };
                return stats;
            } catch (e) {
                return { streak: 0, lastStudyDate: null, totalReviews: 0, totalCorrect: 0 };
            }
        }

        function saveStats(stats) {
            localStorage.setItem('estudiapp_stats', JSON.stringify(stats));
        }

        function recordSrsAttempt(isCorrect) {
            let stats = getStats();
            stats.totalReviews++;
            if (isCorrect) stats.totalCorrect++;

            const todayStr = new Date().toLocaleDateString('en-CA');
            if (stats.lastStudyDate !== todayStr) {
                if (stats.lastStudyDate) {
                    const lastDate = new Date(stats.lastStudyDate);
                    const today = new Date(todayStr);
                    const diffTime = Math.abs(today - lastDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (diffDays === 1) stats.streak++;
                    else if (diffDays > 1) stats.streak = 1;
                } else {
                    stats.streak = 1;
                }
                stats.lastStudyDate = todayStr;
            }
            saveStats(stats);
        }

        function updateWordSrs(wordKey, isCorrect) {
            if (!packId || !wordKey) return;
            let srsData = getSrsData();
            if (!srsData[packId]) srsData[packId] = {};
            if (!srsData[packId][wordKey]) {
                srsData[packId][wordKey] = { box: 1, nextReview: 0, lastAttempt: 0 };
            }
            
            let srsInfo = srsData[packId][wordKey];
            srsInfo.lastAttempt = Date.now();
            
            if (isCorrect) {
                srsInfo.box = Math.min(5, srsInfo.box + 1);
            } else {
                srsInfo.box = 1;
            }
            
            let interval = 60 * 1000; // 1 min (box 1)
            if (srsInfo.box === 2) interval = 10 * 60 * 1000;
            else if (srsInfo.box === 3) interval = 60 * 60 * 1000;
            else if (srsInfo.box === 4) interval = 24 * 60 * 60 * 1000;
            else if (srsInfo.box === 5) interval = 4 * 24 * 60 * 60 * 1000;
            
            srsInfo.nextReview = Date.now() + interval;
            saveSrsData(srsData);
            recordSrsAttempt(isCorrect);
        }

        function selectNextEntry() {
            if (entries.length === 0) return null;
            const srsData = getSrsData()[packId] || {};
            
            let dueEntries = [];
            let neverReviewed = [];
            let lowBoxEntries = [];
            
            entries.forEach(entry => {
                const parts = entry.text.split("->");
                const wordKey = parts[0].trim();
                const srsInfo = srsData[wordKey];
                
                if (!srsInfo) neverReviewed.push(entry);
                else if (srsInfo.nextReview <= Date.now()) dueEntries.push(entry);
                else lowBoxEntries.push({ entry, box: srsInfo.box });
            });
            
            if (dueEntries.length > 0) return dueEntries[Math.floor(Math.random() * dueEntries.length)];
            if (neverReviewed.length > 0) return neverReviewed[Math.floor(Math.random() * neverReviewed.length)];
            
            lowBoxEntries.sort((a, b) => a.box - b.box);
            if (lowBoxEntries.length > 0) return lowBoxEntries[0].entry;
            return entries[Math.floor(Math.random() * entries.length)];
        }

        function toggleImages() {
            updateVisibility();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeDirect').classList.toggle('active', mode === 'direct');
            document.getElementById('modeFlashcard').classList.toggle('active', mode === 'flashcard');
            document.getElementById('modeQuiz').classList.toggle('active', mode === 'quiz');
            document.getElementById('modeWrite').classList.toggle('active', mode === 'write');
            
            const actionBtn = document.getElementById('actionBtn');
            const historySec = document.getElementById('historySection');
            const quizScore = document.getElementById('quizScore');
            const writeArea = document.getElementById('writeArea');
            const srsFeedback = document.getElementById('srsFeedback');

            writeArea.style.display = 'none';
            srsFeedback.style.display = 'none';

            if (mode === 'quiz') {
                actionBtn.innerText = 'Siguiente Pregunta';
                actionBtn.style.display = 'block';
                actionBtn.onclick = startNewQuizQuestion;
                historySec.style.display = 'none';
                quizScore.style.display = 'block';
                quizAttempts = 0;
                quizCorrect = 0;
                updateQuizScore();
                startNewQuizQuestion();
            } else if (mode === 'write') {
                actionBtn.innerText = 'Comprobar';
                actionBtn.style.display = 'block';
                actionBtn.onclick = checkWriteAnswer;
                historySec.style.display = 'none';
                quizScore.style.display = 'none';
                document.getElementById('quizOptions').style.display = 'none';
                document.getElementById('subContainer').style.display = 'none';
                document.getElementById('rollVal').style.display = 'none';
                startWriteQuestion();
            } else {
                actionBtn.innerText = 'Tirar ' + formula;
                actionBtn.style.display = 'block';
                actionBtn.onclick = roll;
                historySec.style.display = 'block';
                quizScore.style.display = 'none';
                document.getElementById('quizOptions').style.display = 'none';
                document.getElementById('subContainer').style.display = 'flex';
                document.getElementById('rollVal').style.display = 'block';
                
                if (lastEnglishText) {
                    document.getElementById('subText').innerText = lastEnglishText;
                    isRevealed = (mode === 'direct');
                    updateVisibility();
                } else {
                    document.getElementById('mainText').innerText = '---';
                    document.getElementById('rollVal').innerText = 'Tira el dado para empezar';
                    document.getElementById('subContainer').classList.add('hidden');
                    document.getElementById('btnReveal').style.display = 'none';
                    document.getElementById('imgContainer').style.display = 'none';
                }
            }
        }

        function roll() {
            const entry = selectNextEntry();
            if (!entry) return;

            // Simulate roll value within entry range
            const val = Math.floor(Math.random() * (entry.max - entry.min + 1)) + entry.min;
            const rawText = entry.text;

            const parts = rawText.split("->");
            const main = parts[0].trim();
            const sub = parts.length > 1 ? parts[1].trim() : "";
            
            lastSpanishText = main;
            lastEnglishText = sub;

            // Resolve Image URL
            let imageUrl = "";
            if (parts.length > 2) {
                const third = parts[2].trim();
                if (third.startsWith("http://") || third.startsWith("https://")) {
                    imageUrl = third;
                }
            }
            if (!imageUrl && sub) {
                const queryWord = sub.split('/')[0].split(';')[0].split(',')[0].trim().toLowerCase();
                if (queryWord) {
                    imageUrl = "https://loremflickr.com/320/240/" + encodeURIComponent(queryWord);
                }
            }

            document.getElementById('rollVal').innerText = "Tirada (SRS): " + val;
            document.getElementById('mainText').innerText = main;
            document.getElementById('subText').innerText = sub;
            
            const vocabImg = document.getElementById('vocabImg');
            if (imageUrl) {
                vocabImg.src = imageUrl;
            } else {
                vocabImg.src = "";
            }

            isRevealed = (currentMode === 'direct' || sub === "");
            updateVisibility();

            if (currentMode === 'direct') {
                document.getElementById('srsFeedback').style.display = 'flex';
            } else {
                document.getElementById('srsFeedback').style.display = 'none';
            }

            const area = document.getElementById('resultArea');
            area.style.transform = "scale(1.02)";
            setTimeout(() => area.style.transform = "scale(1)", 150);

            addHistory(val, main, sub);
        }

        function updateVisibility() {
            const subContainer = document.getElementById('subContainer');
            const btnReveal = document.getElementById('btnReveal');
            const imgContainer = document.getElementById('imgContainer');
            const showImages = document.getElementById('enableImages').checked;
            const hasImg = document.getElementById('vocabImg').getAttribute('src') !== "";

            if (isRevealed) {
                subContainer.classList.remove('hidden');
                btnReveal.style.display = 'none';
                if (showImages && hasImg && currentMode !== 'quiz' && currentMode !== 'write') {
                    imgContainer.style.display = 'block';
                } else {
                    imgContainer.style.display = 'none';
                }
            } else {
                subContainer.classList.add('hidden');
                btnReveal.style.display = 'block';
                imgContainer.style.display = 'none';
            }
        }

        function reveal() {
            isRevealed = true;
            updateVisibility();
            speak();

            if (currentMode === 'flashcard') {
                document.getElementById('srsFeedback').style.display = 'flex';
            }
        }

        function rateSrs(isCorrect) {
            updateWordSrs(lastSpanishText, isCorrect);
            document.getElementById('srsFeedback').style.display = 'none';
        }

        function speak() {
            if (!lastEnglishText) return;
            const textToSpeak = lastEnglishText.split('/')[0].split(';')[0].trim();
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function parseRoll(f) {
            const match = f.match(/(d+)d(d+)/);
            if (!match) return Math.floor(Math.random() * 8) + 1;
            const n = parseInt(match[1]);
            const d = parseInt(match[2]);
            let total = 0;
            for(let i=0; i<n; i++) total += Math.floor(Math.random() * d) + 1;
            return total;
        }

        function addHistory(val, main, sub) {
            const hist = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = "<span><b>[" + val + "]</b> " + main + "</span><span style='color:var(--primary); font-weight: 500;'>" + sub + "</span>";
            hist.prepend(item);
        }

        function cleanText(txt) {
            if (!txt) return "";
            return txt.toLowerCase()
                .normalize("NFD").replace(/[̀-ͯ]/g, "")
                .replace(/[.,/#!$%^&*;:{}=-_~()]/g, "")
                .replace(/s+/g, " ")
                .trim();
        }

        function getDiffHighlight(typed, correct) {
            let html = "";
            const len = Math.max(typed.length, correct.length);
            for (let i = 0; i < len; i++) {
                if (typed[i] === correct[i]) html += typed[i];
                else {
                    if (typed[i]) html += '<span class="diff-del">' + typed[i] + '</span>';
                    if (correct[i]) html += '<span class="diff-ins">' + correct[i] + '</span>';
                }
            }
            return html;
        }

        // Write Mode
        function startWriteQuestion() {
            const entry = selectNextEntry();
            if (!entry) return;

            document.getElementById('subContainer').style.display = 'none';
            document.getElementById('btnReveal').style.display = 'none';
            document.getElementById('rollVal').style.display = 'none';
            document.getElementById('imgContainer').style.display = 'none';
            document.getElementById('quizOptions').style.display = 'none';
            document.getElementById('srsFeedback').style.display = 'none';

            const parts = entry.text.split("->");
            const spanish = parts[0].trim();
            const english = parts.length > 1 ? parts[1].trim() : "";
            
            lastSpanishText = spanish;
            lastEnglishText = english;

            document.getElementById('mainText').innerText = spanish;
            
            const writeArea = document.getElementById('writeArea');
            writeArea.style.display = 'flex';

            const input = document.getElementById('writeInput');
            input.value = "";
            input.disabled = false;
            input.focus();

            const feedback = document.getElementById('writeFeedback');
            feedback.innerText = "";
            feedback.className = "write-feedback";

            const actionBtn = document.getElementById('actionBtn');
            actionBtn.innerText = 'Comprobar';
            actionBtn.onclick = checkWriteAnswer;

            input.onkeydown = (e) => {
                if (e.key === 'Enter') checkWriteAnswer();
            };
        }

        function checkWriteAnswer() {
            const input = document.getElementById('writeInput');
            const feedback = document.getElementById('writeFeedback');
            const actionBtn = document.getElementById('actionBtn');
            
            const typed = input.value.trim();
            if (!typed) return;

            input.disabled = true;

            const correctOptions = lastEnglishText.split(/[/;,]/).map(s => cleanText(s.trim()));
            const typedClean = cleanText(typed);
            const isCorrect = correctOptions.includes(typedClean);

            updateWordSrs(lastSpanishText, isCorrect);

            if (isCorrect) {
                feedback.innerText = "¡Correcto! 🎉";
                feedback.className = "write-feedback correct";
                speak();
            } else {
                const diffMarkup = getDiffHighlight(typed, lastEnglishText.split(/[/;,]/)[0].trim());
                feedback.innerHTML = 'Incorrecto. <br>Tu intento: <span style="font-weight:normal;">' + diffMarkup + '</span><br>Correcto: <strong>' + lastEnglishText + '</strong>';
                feedback.className = "write-feedback incorrect";
            }

            actionBtn.innerText = 'Siguiente Pregunta';
            actionBtn.onclick = startWriteQuestion;
        }

        // Quiz Logic
        function updateQuizScore() {
            document.getElementById('quizScore').innerText = "Puntuación: " + quizCorrect + "/" + quizAttempts;
        }

        function startNewQuizQuestion() {
            if (entries.length < 2) {
                document.getElementById('mainText').innerText = "Se necesitan al menos 2 elementos para jugar.";
                return;
            }
            
            document.getElementById('subContainer').style.display = 'none';
            document.getElementById('btnReveal').style.display = 'none';
            document.getElementById('rollVal').style.display = 'none';
            document.getElementById('imgContainer').style.display = 'none';
            document.getElementById('writeArea').style.display = 'none';
            document.getElementById('srsFeedback').style.display = 'none';
            
            const entry = selectNextEntry();
            if (!entry) return;
            currentQuizEntry = entry;
            
            const parts = entry.text.split("->");
            const spanish = parts[0].trim();
            const english = parts.length > 1 ? parts[1].trim() : "";
            
            lastSpanishText = spanish;
            lastEnglishText = english;

            document.getElementById('mainText').innerText = spanish;
            
            const options = [english];
            const otherEntries = entries.filter(e => e.text.split("->")[0].trim() !== spanish);
            const distractors = otherEntries
                .map(e => e.text.split("->")[1]?.trim() || "")
                .filter(txt => txt !== "" && txt !== english);
            
            const uniqueDistractors = [...new Set(distractors)];
            
            while (options.length < Math.min(4, uniqueDistractors.length + 1)) {
                const randomDist = uniqueDistractors[Math.floor(Math.random() * uniqueDistractors.length)];
                if (!options.includes(randomDist)) {
                    options.push(randomDist);
                }
            }
            
            options.sort(() => Math.random() - 0.5);
            
            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';
            optionsContainer.style.display = 'flex';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.innerText = opt;
                btn.onclick = () => selectQuizOption(btn, opt, english);
                optionsContainer.appendChild(btn);
            });
        }

        function selectQuizOption(btn, selected, correct) {
            const buttons = document.querySelectorAll('.quiz-option');
            buttons.forEach(b => b.disabled = true);
            
            quizAttempts++;
            const isCorrect = (selected === correct);
            updateWordSrs(lastSpanishText, isCorrect);

            if (isCorrect) {
                btn.classList.add('correct');
                quizCorrect++;
                speak();
            } else {
                btn.classList.add('incorrect');
                buttons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('correct');
                    }
                });
            }
            updateQuizScore();
        }
    </script>
</body>
</html>
